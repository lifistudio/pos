name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flows:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: pos_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pos:ci_only@127.0.0.1:5432/pos_check
      BETTER_AUTH_SECRET: ci-only-secret-value-not-used-anywhere-000000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm check:flows
  check:
    runs-on: ubuntu-latest
    env:
      # Nilai dummy hanya untuk build & pemeriksaan (tidak ada koneksi DB pada langkah ini).
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-value-not-used-anywhere-000000
      BETTER_AUTH_URL: http://localhost:3000
      PAYMENT_PROVIDER: none
      BOARDUI_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:pricing
      - run: pnpm check:marketplace
      - run: pnpm check:payments
      - run: pnpm check:media
      - run: pnpm check:barcode
      - run: pnpm check:receipt
      - run: pnpm check:ecr
      - run: pnpm check:oauth
      - run: pnpm build
      - run: pnpm audit --prod
