<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Offline · Konten POS</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #0a0a0a; --muted: #6b7280; --card: #f5f5f5; --accent: #2563eb; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #a1a1aa; --card: #18181b; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 420px; background: var(--card); border-radius: 24px; padding: 28px; }
      h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
      p { margin: 0 0 16px; color: var(--muted); }
      a, button { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border-radius: 12px; border: 0; font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; }
      .primary { background: var(--accent); color: #fff; width: 100%; margin-bottom: 8px; }
      .ghost { background: transparent; color: var(--fg); width: 100%; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tidak ada koneksi internet</h1>
      <p>Halaman ini butuh koneksi. Kasir tetap bisa dipakai offline bila sudah pernah dibuka di perangkat ini; transaksinya disinkronkan saat koneksi kembali.</p>
      <a class="primary" href="/pos">Buka kasir</a>
      <button class="ghost" type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
