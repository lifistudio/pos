allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': false
  esbuild: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@next/env@16.4.4'
  - '@next/swc-darwin-arm64@16.4.4'
  - '@next/swc-darwin-x64@16.4.4'
  - '@next/swc-linux-arm64-gnu@16.4.4'
  - '@next/swc-linux-arm64-musl@16.4.4'
  - '@next/swc-linux-x64-gnu@16.4.4'
  - '@next/swc-linux-x64-musl@16.4.4'
  - '@next/swc-win32-arm64-msvc@16.4.4'
  - '@next/swc-win32-x64-msvc@16.4.4'
  - next@16.4.4
  - '@next/eslint-plugin-next@16.4.4'
  - eslint-config-next@16.4.4
  - minimatch@11.0.4

# Perbaikan keamanan dependensi transitif (lihat docs/SECURITY_LOG.md).
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'fast-uri@>=3.0.0 <3.1.9': ^3.1.9
  'minimatch@<11.0.1': ^11.0.4
